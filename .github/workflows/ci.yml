name: CI

on:
  push:
    branches:
      - main
      - p1-foundation
      - "feature/**"
  pull_request:
    branches:
      - main
      - "phase/**"

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stacksense
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pr0xy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stacksense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy backend

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:pr0xy@localhost:5432/stacksense
        run: pytest