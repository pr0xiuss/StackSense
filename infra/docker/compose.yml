services:
  postgres:
    image: postgres:16
    container_name: stacksense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stacksense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pr0xy
    ports:
      - "5434:5432"
    volumes:
      - stacksense_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stacksense"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: stacksense-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - stacksense_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stacksense_postgres_data:
  stacksense_rabbitmq_data:
