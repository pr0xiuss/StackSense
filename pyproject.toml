[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    "tests/fixtures",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
]

[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = '''tests/fixtures'''

[tool.mypy]
platform = "linux"
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "backend.worker.*"
disallow_untyped_decorators = false