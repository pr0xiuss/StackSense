services:
  postgres:
    image: postgres:16
    container_name: stacksense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stacksense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pr0xy
    ports:
      - "5434:5432"
    volumes:
      - stacksense_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacksense -d stacksense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stacksense_postgres_data: