# Cgroup-only drop-in; apply ONLY after administrator identity/path review.
# No new daemon/unit/queue is created by this drop-in.
# Existing ops units are user services under %h; do NOT put User=/Group= here
# or change their identity/home/worktree implicitly. Separate-principal B1
# experiments run from a protected installation in an approved transient scope.
[Service]
Delegate=cpu memory pids
DelegateSubgroup=worker
UMask=0077
# The ordinary worker needs the one exact sudo seal command. Do not apply
# NoNewPrivileges=yes here: the isolated Node launcher sets it before bwrap.
